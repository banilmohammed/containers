name: Build and publish images

on:
  push:
    branches: [main]
    paths:
      - "environments/**"

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python-dev: ${{ steps.filter.outputs.python-dev }}
      r-research: ${{ steps.filter.outputs.r-research }}
      r-seurat: ${{ steps.filter.outputs.r-seurat }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python-dev:
              - 'environments/python-dev/**'
            r-research:
              - 'environments/r-research/**'
            r-seurat:
              - 'environments/r-seurat/**'

  python-dev:
    needs: changes
    if: needs.changes.outputs.python-dev == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/python-dev
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: environments/python-dev
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  r-research:
    needs: changes
    if: needs.changes.outputs.r-research == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/r-research
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: environments/r-research
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  r-seurat:
    needs: [changes, r-research]
    if: |
      always() &&
      needs.changes.outputs.r-seurat == 'true' &&
      (needs.r-research.result == 'success' || needs.r-research.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/r-seurat
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: environments/r-seurat
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
